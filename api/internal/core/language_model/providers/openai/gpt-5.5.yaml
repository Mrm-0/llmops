model: gpt-5.5
label: GPT-5.5
model_type: chat
features:
  - tool_call
  - agent_thought
  - image_input
context_window: 1050000
max_output_tokens: 128000
attributes:
  model: gpt-5.5
  stream_usage: true
parameters:
  # gpt-5 系列属于推理模型，官方明确拒绝 temperature/top_p/presence_penalty/frequency_penalty，
  # 传了会直接 400（Unsupported parameter），因此这里不提供这些采样参数。
  - name: reasoning_effort
    label: 推理强度
    type: string
    help: 控制回答前的思考深度。none 关闭思考（最快最省），xhigh 为最强推理；不指定时官方默认 medium。注意 gpt-5.5 不支持 max 档位
    required: false
    default: medium
    options:
      - label: 关闭
        value: none
      - label: 低
        value: low
      - label: 中
        value: medium
      - label: 高
        value: high
      - label: 超高
        value: xhigh
  - name: verbosity
    label: 回答详细度
    type: string
    help: 控制可见回答的长度，不影响推理深度，low 更简洁、high 更详尽
    required: false
    default: medium
    options:
      - label: 简洁
        value: low
      - label: 适中
        value: medium
      - label: 详尽
        value: high
  # 推理模型的输出上限参数名是 max_completion_tokens，max_tokens 会被直接拒绝
  - name: max_completion_tokens
    label: 最大输出标记
    type: int
    help: 单次响应可生成的最大 token 数，包含隐藏的推理 token；推理 token 也计入该预算，设置过小会导致回答为空且 finish_reason 为 length
    required: false
    default: 8192
    min: 1
    max: 128000
    precision: 0
    options: []
metadata:
  pricing:
    input: 5.00
    output: 30.00
    unit: 0.000001
    unit_label: USD / 1M tokens
    note: 缓存命中输入 0.50；Batch 接口输入 2.50 / 输出 15.00。unit 为每 token 换算系数
  knowledge_cutoff: 2025-08-31
