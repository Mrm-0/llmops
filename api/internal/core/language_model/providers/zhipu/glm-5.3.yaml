model: glm-5.3
label: GLM-5.3
model_type: chat
features:
  # GLM-5.3 为纯文本模型，不支持图片输入
  - tool_call
  - agent_thought
context_window: 1048576
max_output_tokens: 131072
attributes:
  model: glm-5.3
  base_url: https://open.bigmodel.cn/api/paas/v4
  stream_usage: true
parameters:
  # GLM-5.3 的思考模式默认开启且不支持关闭，传 thinking.type=disabled 会直接 400，
  # 思考深度只能用 reasoning_effort 控制（仅 low/high/max 三个值，其他值报 400）。
  - name: temperature
    label: 温度
    type: float
    help: 温度控制随机性，GLM-5 系列取值范围 0.0~1.0，官方默认 1.0。注意上限是 1，不是 OpenAI 的 2
    required: false
    default: 1
    min: 0
    max: 1
    precision: 2
    options: []
  - name: top_p
    label: Top P
    type: float
    help: 核采样率，取值范围 0.01~1.0。留空表示使用服务端默认值，需要控制随机性时再显式设置
    required: false
    default: null
    min: 0.01
    max: 1
    precision: 2
    options: []
  - name: reasoning_effort
    label: 推理强度
    type: string
    help: GLM-5.3 每次调用都会思考且无法关闭，该参数只控制思考深度，官方默认 max。仅支持 low、high、max 三个值
    required: false
    default: max
    options:
      - label: 低
        value: low
      - label: 高
        value: high
      - label: 最高
        value: max
  - name: max_tokens
    label: 最大标记
    type: int
    help: 单次生成的最大 token 数，取值 1~131072。该额度包含思考过程的 token，简单问题也可能消耗上千 token，建议不要设置过小
    required: false
    default: 16384
    min: 1
    max: 131072
    precision: 0
    options: []
metadata:
  pricing:
    input: 1.40
    output: 4.40
    unit: 0.000001
    unit_label: USD / 1M tokens
    note: 缓存命中输入 0.26；国内开放平台按人民币计价（输入 8 元 / 输出 28 元每百万 token）。unit 为每 token 换算系数
  capabilities:
    thinking: always_on
    json_mode: true
    structured_output: true
    prefix_completion: true
    context_caching: true
  note: 思考内容通过 reasoning_content 字段返回，与 content 分开
