name: cogview_image_generator
label: 智谱CogView生图工具
description: 一个强大的文生图工具
params:
  - name: size
    label: 尺寸
    type: select
    default: 1024x1024
    required: true
    options:
      - value: 1024x1024
        label: "(方)1024x1024"
      - value: 1344x768
        label: "(横屏)1344x768"
      - value: 768x1344
        label: "(竖屏)768x1344"
      - value: 1152x864
        label: "(横屏)1152x864"
      - value: 864x1152
        label: "(竖屏)864x1152"
      - value: 1440x720
        label: "(超宽)1440x720"
      - value: 720x1440
        label: "(超长)720x1440"
