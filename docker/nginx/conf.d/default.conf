# 本地/内网部署版本：只监听 80 端口，不做 HTTPS 跳转
# 如果有域名和证书，再按需补 443 的 server 块
server {
    listen 80;
    server_name _;

    # 把 /api 前缀的请求转发到 llmops-api:5001，并去掉 /api 前缀
    location /api/ {
        proxy_pass http://llmops-api:5001/;
        include proxy.conf;
    }

    # 其余请求交给前端静态服务
    location / {
        proxy_pass http://llmops-ui:3000;
        include proxy.conf;
    }
}
