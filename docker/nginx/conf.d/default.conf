# 本地/内网部署版本：只监听 80 端口，不做 HTTPS 跳转
# 如果有域名和证书，再按需补 443 的 server 块
server {
    listen 80;
    server_name _;

    # 用 Docker 内置 DNS 动态解析上游容器名（127.0.0.11 是 compose 网络的 DNS）。
    # 关键：不加 resolver 时 nginx 只在启动那一刻解析一次 llmops-api/llmops-ui 的 IP 并永久缓存，
    # 一旦上游容器被重建（up -d --build / 崩溃重启）拿到新 IP，nginx 仍指向旧 IP → 全站 502。
    # valid=10s 表示解析结果缓存 10 秒，兼顾性能与及时性。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 把 /api 前缀的请求转发到 llmops-api:5001，并去掉 /api 前缀
    # 注意：proxy_pass 使用变量后不再做 URI 自动替换，必须用 rewrite ... break 手动去掉前缀
    location /api/ {
        set $api_upstream llmops-api;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream:5001;
        include proxy.conf;
    }

    # 其余请求交给前端静态服务
    location / {
        set $ui_upstream llmops-ui;
        proxy_pass http://$ui_upstream:3000;
        include proxy.conf;
    }
}
