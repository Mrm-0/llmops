services:
  llmops-ui:
    image: llmops-ui:0.1.0
    build:
      context: ../ui
      dockerfile: Dockerfile
    container_name: llmops-ui
    restart: always
    environment: [ ]
    # 前端不再单独暴露端口，统一由 llmops-nginx 的 80 端口对外服务
    # （UI 容器内 nginx 没有 /api 转发，直接访问 3000 会导致接口 404）
  llmops-api:
    image: llmops-api:0.1.0
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: llmops-api
    restart: always
    volumes:
      - ./volumes/app/storage:/app/api/storage
      # 模型文件不进镜像（api/.dockerignore 已排除 models/），运行时从宿主机只读挂载
      # 部署前确保仓库 api/models/bge-m3 目录已存在（可先运行 api/download_model.py 下载）
      - ../api/models:/app/api/models:ro
      # 本地FAISS索引目录挂载到宿主机：索引是"数据"不是"代码"，
      # 挂在容器里的话 up -d --build 后会丢失；挂载后由宿主机持久保存
      - ../api/internal/core/vector_store:/app/api/internal/core/vector_store
    environment:
      # 模式为API，代表启用API服务
      MODE: api
      SERVER_WORKER_AMOUNT: 2
      SERVER_THREAD_AMOUNT: 4
      # 数据库迁移配置
      MIGRATION_ENABLED: 'true'
      # JWT加密秘钥（改到 docker/.env 配置）
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # 服务配置（本地部署请改成虚拟机IP，或在 docker/.env 里覆盖）
      SERVICE_IP: ${SERVICE_IP:-192.168.159.128}
      SERVICE_API_PREFIX: ${SERVICE_API_PREFIX:-http://localhost/api}
      # CSRF校验开关
      WTF_CSRF_ENABLED: 'false'
      # SQLAlchemy数据库配置
      # 驱动方言必须是 psycopg（psycopg3）：requirements.txt 装的是 psycopg[binary]==3.3.9
      # 注意：不是 psycopg2（未安装），也不是裸 postgresql://（sqlalchemy 2.1 默认解析会依赖 psycopg3，但显式写更稳）
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-llmops123456}@llmops-db:5432/llmops?client_encoding=utf8
      SQLALCHEMY_POOL_SIZE: 5
      SQLALCHEMY_POOL_RECYCLE: 3600
      SQLALCHEMY_ECHO: 'false'
      # Redis缓存数据库配置
      REDIS_HOST: llmops-redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ''
      REDIS_PASSWORD: ${REDIS_PASSWORD:-llmops123456}
      REDIS_DB: 0
      REDIS_USE_SSL: 'false'
      # Weaviate向量数据库配置
      WEAVIATE_HTTP_HOST: llmops-weaviate
      WEAVIATE_HTTP_PORT: 8080
      WEAVIATE_GRPC_HOST: llmops-weaviate
      WEAVIATE_GRPC_PORT: 50051
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY}
      # 腾讯云COS对象存储
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_SCHEME: https
      COS_BUCKET: ${COS_BUCKET}
      COS_DOMAIN: ''
      # Celery异步队列任务配置
      CELERY_BROKER_DB: 1
      CELERY_RESULT_BACKEND_DB: 1
      CELERY_TASK_IGNORE_RESULT: 'true'
      CELERY_RESULT_EXPIRES: 3600
      CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP: 'true'
      # Github OAuth应用秘钥
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://192.168.159.128/auth/authorize/github}
      # LangSmith配置
      LANGSMITH_TRACING: 'false'
      LANGSMITH_ENDPOINT: https://api.smith.langchain.com
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-LLMOpsDev}
      # HuggingFace配置
      HF_HUB_OFFLINE: 0
      # 辅助Agent智能体应用id标识
      ASSISTANT_AGENT_ID: ${ASSISTANT_AGENT_ID}
      # OpenAI服务提供者
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      # Deepseek服务提供者
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: https://api.deepseek.com
      # 月之暗面服务提供者
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY}
      # 智谱服务提供者
      ZHIPU_API_KEY: ${ZHIPU_API_KEY}
      # 高德工具API秘钥
      GAODE_API_KEY: ${GAODE_API_KEY}
      # 谷歌Serper搜索API秘钥
      SERPER_API_KEY: ${SERPER_API_KEY}
    ports:
      - "5001:5001"
    depends_on:
      llmops-db:
        condition: service_healthy
      llmops-redis:
        condition: service_healthy
      llmops-weaviate:
        condition: service_started
  llmops-celery:
    # 与 llmops-api 共用同一个镜像，不再单独 build（省一半磁盘空间和构建时间）
    image: llmops-api:0.1.0
    container_name: llmops-celery
    restart: always
    volumes:
      - ./volumes/app/storage:/app/api/storage
      # 模型文件不进镜像（api/.dockerignore 已排除 models/），运行时从宿主机只读挂载
      # 部署前确保仓库 api/models/bge-m3 目录已存在（可先运行 api/download_model.py 下载）
      - ../api/models:/app/api/models:ro
      # 本地FAISS索引目录挂载到宿主机：索引是"数据"不是"代码"，
      # 挂在容器里的话 up -d --build 后会丢失；挂载后由宿主机持久保存
      - ../api/internal/core/vector_store:/app/api/internal/core/vector_store
    environment:
      # 模式为celery，代表启用Celery异步任务队列
      MODE: celery
      CELERY_WORKER_AMOUNT: 2
      # 数据库迁移配置（迁移只由 llmops-api 执行，这里关闭避免并发冲突）
      MIGRATION_ENABLED: 'false'
      # 服务配置（本地部署请改成虚拟机IP，或在 docker/.env 里覆盖）
      SERVICE_IP: ${SERVICE_IP:-192.168.159.128}
      SERVICE_API_PREFIX: ${SERVICE_API_PREFIX:-http://localhost/api}
      # JWT加密秘钥（改到 docker/.env 配置）
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # CSRF校验开关
      WTF_CSRF_ENABLED: 'false'
      # SQLAlchemy数据库配置
      # 驱动方言必须是 psycopg（psycopg3）：requirements.txt 装的是 psycopg[binary]==3.3.9
      # 注意：不是 psycopg2（未安装），也不是裸 postgresql://（sqlalchemy 2.1 默认解析会依赖 psycopg3，但显式写更稳）
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-llmops123456}@llmops-db:5432/llmops?client_encoding=utf8
      SQLALCHEMY_POOL_SIZE: 5
      SQLALCHEMY_POOL_RECYCLE: 3600
      SQLALCHEMY_ECHO: 'false'
      # Redis缓存数据库配置
      REDIS_HOST: llmops-redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ''
      REDIS_PASSWORD: ${REDIS_PASSWORD:-llmops123456}
      REDIS_DB: 0
      REDIS_USE_SSL: 'false'
      # Weaviate向量数据库配置
      WEAVIATE_HTTP_HOST: llmops-weaviate
      WEAVIATE_HTTP_PORT: 8080
      WEAVIATE_GRPC_HOST: llmops-weaviate
      WEAVIATE_GRPC_PORT: 50051
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY}
      # 腾讯云COS对象存储
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_SCHEME: https
      COS_BUCKET: ${COS_BUCKET}
      COS_DOMAIN: ''
      # Celery异步队列任务配置
      CELERY_BROKER_DB: 1
      CELERY_RESULT_BACKEND_DB: 1
      CELERY_TASK_IGNORE_RESULT: 'true'
      CELERY_RESULT_EXPIRES: 3600
      CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP: 'true'
      # Github OAuth应用秘钥
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://192.168.159.128/auth/authorize/github}
      # LangSmith配置
      LANGSMITH_TRACING: 'false'
      LANGSMITH_ENDPOINT: https://api.smith.langchain.com
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-LLMOpsDev}
      # HuggingFace配置
      HF_HUB_OFFLINE: 0
      # 辅助Agent智能体应用id标识
      ASSISTANT_AGENT_ID: ${ASSISTANT_AGENT_ID}
      # OpenAI服务提供者
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      # DeepSeek服务提供者
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: https://api.deepseek.com
      # 月之暗面服务提供者
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY}
      # 智谱服务提供者
      ZHIPU_API_KEY: ${ZHIPU_API_KEY}
      # 高德工具API秘钥
      GAODE_API_KEY: ${GAODE_API_KEY}
      # 谷歌Serper搜索API秘钥
      SERPER_API_KEY: ${SERPER_API_KEY}
    depends_on:
      llmops-db:
        condition: service_healthy
      llmops-redis:
        condition: service_healthy
      llmops-weaviate:
        condition: service_started
  llmops-redis:
    # 与项目依赖 redis==8.1.0 客户端对应；如需更保守可换 redis:7.4-alpine
    image: redis:8-alpine
    restart: always
    container_name: llmops-redis
    volumes:
      - ./volumes/redis/data:/data
    # 启动redis服务时配置：设置密码 + 开启AOF持久化
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-llmops123456}", "--appendonly", "yes" ]
    healthcheck:
      # 带密码做健康检查，否则 redis-cli ping 会返回 NOAUTH，容器永远是 unhealthy
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-llmops123456}", "--no-auth-warning", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "6379:6379"
  llmops-db:
    image: postgres:15-alpine
    restart: always
    container_name: llmops-db
    environment:
      # 配置默认的账户名、账户密码、默认数据库、数据存储的位置
      POSTGRES_USER: postgres
      PGUSER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmops123456}
      POSTGRES_DB: llmops
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # 将postgres数据挂载到本地./volumes/db/data上
      - ./volumes/db/data:/var/lib/postgresql/data/pgdata
      # 初始化脚本只有在空数据挂载的情况下才会触发执行(.sql/.sh等)，如果已经存在数据则不会执行
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # 每隔1s发起一个健康测试，最多重试30次
      test: [ "CMD-SHELL", "pg_isready -U postgres -d llmops" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    ports:
      - "5432:5432"
  llmops-weaviate:
    # 与项目依赖 weaviate_client==4.23.1 匹配（该客户端支持 1.27~1.29 服务端）
    image: semitechnologies/weaviate:1.28.4
    container_name: llmops-weaviate
    restart: always
    environment:
      QUERY_DEFAULTS_LIMIT: 25  # 查询默认返回的数据条数
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'false'  # 需要授权才能和weaviate进行交互
      PERSISTENCE_DATA_PATH: /var/lib/weaviate  # weaviate数据存储路径
      DEFAULT_VECTORIZER_MODULE: 'none'  # 向量化模块设置为none
      CLUSTER_HOSTNAME: 'node1'  # 节点的主机名字
      AUTHENTICATION_APIKEY_ENABLED: 'true'  # 启动基于API秘钥的身份校验
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY}  # 允许的API秘钥列表
      AUTHENTICATION_APIKEY_USERS: 'mingfengchen2026@163.com'  # 基于秘钥的API身份列表
      AUTHORIZATION_ADMINLIST_ENABLED: 'true'  # 启动AdminList授权方案
      AUTHORIZATION_ADMINLIST_USERS: 'mingfengchen2026@163.com'  # 使用AdminList方案时具有管理权限的用户
    volumes:
      - ./volumes/weaviate:/var/lib/weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
  llmops-nginx:
    # 固定到 stable 通道，避免 latest 漂移导致构建/配置不兼容
    image: nginx:stable-alpine
    restart: always
    container_name: llmops-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - llmops-ui
      - llmops-api
    ports:
      - "80:80"
      # 本地/内网部署没有域名证书，先不开 443；配好证书再放开下面这行并挂载 ssl 目录
      # - "443:443"
